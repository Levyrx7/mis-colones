<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Colones</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Colones">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EAF1EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Libreta de billete: papel verde menta, tinta de billete, marigold para el dinero que te queda. */
  --bg: #EAF1EC;
  --surface: #FFFFFF;
  --ink: #0F2D27;
  --muted: #587069;
  --line: #D3DFD8;
  --accent: #0E7357;
  --accent-soft: #D7EDE3;
  --note: #0F3B31;
  --note-ink: #E9F5EF;
  --gold: #F0BE45;
  --ok: #1B8656;
  --warn: #B87908;
  --bad: #C0402B;
  --seg2: #7FB8A2;
  --seg4: #C0402B;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grid: #E3EAE6; --axis: #B9C7C0;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1613; --surface: #122520; --ink: #E3EEE9; --muted: #92A9A1; --line: #20372F;
    --accent: #43C08F; --accent-soft: #173A2F; --gold: #F3C658;
    --ok: #4CC488; --warn: #E5A93A; --bad: #EF7A63; --seg2: #2F6E5A; --seg4: #EF7A63;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #1D332C; --axis: #2E4A41;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1613; --surface: #122520; --ink: #E3EEE9; --muted: #92A9A1; --line: #20372F;
  --accent: #43C08F; --accent-soft: #173A2F; --gold: #F3C658;
  --ok: #4CC488; --warn: #E5A93A; --bad: #EF7A63; --seg2: #2F6E5A; --seg4: #EF7A63;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #1D332C; --axis: #2E4A41;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; }
.brand b { color: var(--accent); font-weight: 800; }
.month { display: flex; align-items: center; gap: 4px; }
.month button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.month span { min-width: 112px; text-align: center; font-weight: 600; font-size: .95rem; }
.sync { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.cloud i { background: var(--ok); }
.sync.error i, .sync.slow i { background: var(--warn); }

main { flex: 1; padding: 16px 16px calc(env(safe-area-inset-bottom) + 110px); display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
p { margin: 0; }

.note { position: relative; overflow: hidden; border-radius: 18px; padding: 20px 18px 18px; color: var(--note-ink);
  background: repeating-radial-gradient(circle at 92% 8%, transparent 0 7px, rgba(240,190,69,.10) 7px 8px), repeating-radial-gradient(circle at -6% 118%, transparent 0 9px, rgba(233,245,239,.07) 9px 10px), var(--note);
  display: flex; flex-direction: column; gap: 14px; }
.note::after { content: "₡"; position: absolute; right: 14px; bottom: -28px; font-family: var(--font-display); font-weight: 800; font-size: 9rem; line-height: 1; color: rgba(240,190,69,.12); pointer-events: none; }
.note .label { font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.note .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 11vw, 3.1rem); line-height: 1; color: var(--gold); letter-spacing: -0.02em; }
.note .big.neg { color: #FF9B86; }
.note .sub { font-size: .92rem; opacity: .92; max-width: 40ch; }
.flow { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: rgba(255,255,255,.12); }
.flow span { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: 1fr; gap: 6px; font-size: .84rem; position: relative; z-index: 1; max-width: 320px; }
.legend div { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; font-weight: 600; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.tile .v { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }

.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.amt { font-weight: 600; white-space: nowrap; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.list > .item:first-child { border-top: 0; }
button.item { cursor: pointer; }
.name { font-weight: 500; overflow-wrap: anywhere; }
.ico { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.3rem; flex: none; line-height: 1; }
.ico.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 1.05rem; }

.pill { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; white-space: nowrap; letter-spacing: .02em; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.idle { background: var(--accent-soft); color: var(--muted); }

.check { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: transparent; flex: none; cursor: pointer; display: grid; place-items: center; color: transparent; font-weight: 800; padding: 0; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.done .name { text-decoration: line-through; color: var(--muted); }

.bar { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar span.warn { background: var(--warn); }
.bar span.bad { background: var(--bad); }
.bar span.gold { background: var(--gold); }

.qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.q { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.q .k { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.q .save { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--accent); }
.q .line { display: flex; justify-content: space-between; font-size: .84rem; gap: 6px; }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: .84rem; color: var(--muted); font-weight: 500; }
input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 1rem; color: var(--ink); min-width: 0; }
.money { position: relative; }
.money::before { content: "₡"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.money input { padding-left: 28px; }
.amount-in input { font-family: var(--font-display); font-size: 2rem; font-weight: 700; padding: 10px 12px 10px 40px; }
.amount-in.money::before { font-size: 1.8rem; left: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; align-items: end; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .88rem; white-space: nowrap; flex: none; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn { appearance: none; border: 0; border-radius: 12px; padding: 13px 16px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; font-size: 1rem; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.sm { padding: 8px 12px; font-size: .88rem; border-radius: 10px; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.btn.danger.arm { background: var(--bad); color: #fff; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 6px; cursor: pointer; font-size: .88rem; }
.seg button.on { background: var(--accent); color: #fff; font-weight: 700; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.callout { border-left: 4px solid var(--gold); background: color-mix(in srgb, var(--gold) 12%, var(--surface)); padding: 12px 14px; border-radius: 0 12px 12px 0; font-size: .92rem; }
.callout.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, var(--surface)); }
.callout.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.day { font-size: .78rem; color: var(--muted); font-weight: 600; margin-top: 10px; }
.empty { color: var(--muted); font-size: .92rem; padding: 6px 0; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
details > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .88rem; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }

.shortcuts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.sc { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: .74rem; font-weight: 600; text-align: center; line-height: 1.15; }
.sc span:first-child { font-size: 1.5rem; line-height: 1; }

.meta-card { gap: 10px; }
.meta-top { display: flex; align-items: center; gap: 12px; }
.meta-num { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
.prio { font-size: .72rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 7px; }

/* hoja inferior */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(5,20,16,.45); border: 0; padding: 0; cursor: pointer; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px); display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 2px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: -8px; background: var(--surface); padding: 6px 0; z-index: 1; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px; }
.icons { display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 6px; }
.icons button { aspect-ratio: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; font-size: 1.25rem; cursor: pointer; padding: 0; line-height: 1; }
.icons button.on { border: 2px solid var(--accent); background: var(--accent-soft); }
.tipos { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.tipos button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .7rem; font-weight: 600; cursor: pointer; line-height: 1.15; text-align: center; }
.tipos button span:first-child { font-size: 1.35rem; line-height: 1; }
.tipos button.on { border: 2px solid var(--accent); background: var(--accent-soft); }
.part { display: grid; grid-template-columns: minmax(0,1fr) 120px 34px; gap: 8px; align-items: center; }
.sheet-actions { display: flex; flex-direction: column; gap: 8px; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu button { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 16px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; cursor: pointer; text-align: left; }
.menu button span:first-child { font-size: 1.6rem; }
.menu button b { font-size: .98rem; }

.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(env(safe-area-inset-bottom) + 80px); z-index: 7; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 2rem; line-height: 1; cursor: pointer; box-shadow: 0 6px 18px rgba(14,115,87,.35); display: grid; place-items: center; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px); display: flex; justify-content: center; }
nav.tabs .in { display: flex; width: 100%; max-width: 560px; }
nav.tabs button { flex: 1; min-width: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 1px; font-size: .66rem; color: var(--muted); cursor: pointer; font-weight: 600; border-radius: 10px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--accent); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .78rem; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; z-index: 2; }
.chart .tip b { display: block; font-size: .9rem; }
.lg { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.lg span { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.hb { height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; }
.hb span { display: block; height: 100%; border-radius: 5px; background: var(--s2); }
.hb.inc span { background: var(--s1); }
.hb.sav span { background: var(--s3); }
.delta { font-size: .74rem; font-weight: 600; }
table.t { width: 100%; border-collapse: collapse; font-size: .84rem; }
table.t th, table.t td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { color: var(--muted); font-weight: 600; font-size: .76rem; }
.tablewrap { overflow-x: auto; }
.segc { display: flex; background: var(--accent-soft); border-radius: 12px; padding: 4px; gap: 4px; }
.segc button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 9px; font-weight: 600; cursor: pointer; color: var(--muted); }
.segc button.on { background: var(--accent); color: #fff; }
.mstrip { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
.mstrip button { flex: 1; border: 0; background: none; padding: 10px 0 9px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: .95rem; border-bottom: 3px solid transparent; }
.mstrip button.on { color: var(--accent); border-bottom-color: var(--accent); }
.ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; flex: none; background: conic-gradient(var(--rc) calc(var(--p) * 1%), var(--accent-soft) 0); position: relative; }
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; }
.chev { color: var(--muted); font-size: 1.2rem; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 150px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: .9rem; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; max-width: 90%; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 360px) { .qgrid, .tiles { grid-template-columns: 1fr; } .icons { grid-template-columns: repeat(6, minmax(0,1fr)); } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Mis <b>Colones</b></div>
      <div class="month" id="monthNav">
        <button type="button" data-action="prev-month" aria-label="Mes anterior">‹</button>
        <span id="monthLabel"></span>
        <button type="button" data-action="next-month" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="sync" id="sync"><i></i><span>Guardado en este dispositivo</span></div>
  </header>
  <main id="view"></main>
</div>
<button type="button" class="fab" id="fab" data-action="fab" aria-label="Agregar">+</button>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div class="sheet-wrap" id="sheet" hidden>
  <button type="button" class="sheet-bg" data-action="close-sheet" aria-label="Cerrar"></button>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="linkbtn" data-action="close-sheet">Cerrar</button></div>
    <div id="sheet-body" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ================= Utilidades ================= */
  var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  function chartSVG(reps, sel) {

  /* ================= Respaldo ================= */
  function respaldoJSON() { return JSON.stringify({ app: "mis-colones", version: 5, creado: todayISO(), plan: plan, months: months }); }
  async function descargarRespaldo() {
    plan.ultimoRespaldo = todayISO(); lsSave();
    var name = "mis-colones-respaldo-" + todayISO() + ".json", text = respaldoJSON();
    try {
      var file = new File([text], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Respaldo Mis Colones" }); render(); setSync("local"); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    render(); setSync("local"); toast("Respaldo descargado");
  }
  function restaurarDesdeTexto(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { toast("Ese archivo no es un respaldo válido"); return false; }
    if (!d || !d.plan) { toast("Ese archivo no es un respaldo de Mis Colones"); return false; }
    plan = normalize(d.plan); months = d.months || {};

      if (m2 <= 0) return fail("s-monto", "Escribe el monto");
      var p = s.id ? byId(plan.pagos, s.id) : { id: uid() };
      Object.assign(p, { grupo: val("s-grupo"), nombre: nombre, monto: m2, frecuencia: val("s-frec"), dia: Math.min(31, Math.max(1, num(val("s-dia")) || 31)), mes: +val("s-mes") || 12, fecha: val("s-fecha"), nota: val("s-nota").trim(), icono: s.draft.icono });
      if (!s.id) plan.pagos.push(p);
      persist("plan"); done("Pago guardado"); return;
    }
    if (s.kind === "meta") {
      var mn = val("s-nombre").trim();
      if (!mn) return fail("s-nombre", "Ponle un nombre a la meta");
      var parts = [];
      document.querySelectorAll("#s-parts .part").forEach(function (row) {
        var pn = row.querySelector(".p-nombre").value.trim(), pm = num(row.querySelector(".p-monto").value);
        if (pn || pm) parts.push({ id: row.getAttribute("data-id"), nombre: pn || "Parte", monto: pm, pagado: row.getAttribute("data-pagado") === "1" });
      });
      var total = parts.length ? sum(parts, function (x) { return x.monto; }) : num(val("s-monto"));
      if (total <= 0) return fail("s-monto", "Escribe el monto de la meta");
      if (!val("s-fecha")) return fail("s-fecha", "Elige una fecha");
      var mt = s.id ? byId(plan.metas, s.id) : { id: uid(), apartados: [] };
      Object.assign(mt, { nombre: mn, monto: total, fecha: val("s-fecha"), ahorroInicial: num(val("s-ini")), items: parts, icono: s.draft.icono });
      if (!s.id) plan.metas.push(mt);
      persist("plan"); done("Meta guardada"); return;
    }
    if (s.kind === "apartado") {
      var am = num(val("s-monto"));
      if (am <= 0) return fail("s-monto", "Escribe cuánto apartaste");
      var dest = byId(plan.metas, val("s-meta"));
      if (s.id) { var src = byId(plan.metas, s.meta); src.apartados = src.apartados.filter(function (x) { return x.id !== s.id; }); }
      dest.apartados.push({ id: s.id || uid(), fecha: val("s-fecha") || todayISO(), monto: am, nota: val("s-nota").trim() });
      persist("plan"); done(fmt(am) + " apartados para " + dest.nombre); return;
    }
    if (s.kind === "cat") {
      var cn = val("s-nombre").trim(); if (!cn) return fail("s-nombre", "Ponle un nombre");
      var c = s.id ? cat(s.id) : { id: uid() };
      Object.assign(c, { nombre: cn, presupuesto: num(val("s-monto")), grupo: val("s-grupo"), icono: s.draft.icono });
      if (!s.id) plan.categorias.push(c);
      persist("plan"); done("Categoría guardada"); return;
    }
    if (s.kind === "tipo") {
      var tn = val("s-nombre").trim(); if (!tn) return fail("s-nombre", "Ponle un nombre");
      var t = s.id ? tipo(s.id) : { id: uid() };
      Object.assign(t, { nombre: tn, cat: val("s-cat"), grupo: val("s-grupo"), icono: s.draft.icono });
      if (!s.id) plan.tipos.push(t);
      persist("plan");
      if (ui.returnTo) { var r = ui.returnTo; ui.returnTo = null; r.carry.tipo = t.id; r.carry.cat = t.cat; openSheet("gasto", r); render(); toast("Tipo creado"); return; }
      done("Tipo guardado"); return;
    }
    if (s.kind === "extra") {
      var en = val("s-nombre").trim(); if (!en) return fail("s-nombre", "Ponle un nombre");
      var e = s.id ? byId(plan.extras, s.id) : { id: uid() };
      Object.assign(e, { nombre: en, monto: num(val("s-monto")), mes: +val("s-mes"), dia: Math.min(31, Math.max(1, num(val("s-dia")) || 1)), activo: document.getElementById("s-activo").checked, icono: s.draft.icono });
      if (!s.id) plan.extras.push(e);
      persist("plan"); done("Ingreso extra guardado"); return;
    }
    if (s.kind === "deuda") {
      var dn = val("s-nombre").trim(), saldo = num(val("s-saldo")), cuota = num(val("s-cuota"));
      if (!dn) return fail("s-nombre", "Ponle un nombre");
      if (saldo <= 0 || cuota <= 0) return fail("s-saldo", "Completa saldo y cuota");
      var d = s.id ? byId(plan.deudas, s.id) : { id: uid() };
      Object.assign(d, { nombre: dn, saldo: saldo, cuota: cuota, tasa: num(val("s-tasa")), dia: num(val("s-dia")) || 15, icono: s.draft.icono });
      if (!s.id) plan.deudas.push(d);
      persist("plan"); done("Deuda guardada"); return;
    }
  }
  function deleteSheet() {
    var s = ui.sheet; if (!s || !s.id) return;
    if (ui.armed !== "sheet-del") {
      ui.armed = "sheet-del";
      var b = document.querySelector('[data-action="sheet-del"]'); if (b) { b.classList.add("arm"); b.textContent = "Toca otra vez para eliminar"; }
      return;
    }
    if (s.kind === "gasto") { var m = monthData(s.k); m.gastos = m.gastos.filter(function (x) { return x.id !== s.id; }); persist("m-" + s.k); }
    else {
      var list = { pago: "pagos", meta: "metas", cat: "categorias", tipo: "tipos", extra: "extras", deuda: "deudas" }[s.kind];
      if (s.kind === "apartado") { var mt = byId(plan.metas, s.meta); mt.apartados = mt.apartados.filter(function (x) { return x.id !== s.id; }); }
      else plan[list] = plan[list].filter(function (x) { return x.id !== s.id; });
      persist("plan");
    }
    done("Eliminado");
  }
  function fail(id, msg) { toast(msg); var el = document.getElementById(id); if (el) el.focus(); }
  function done(msg) { closeSheet(); render(); toast(msg); }

  var toastTimer;
  function toast(msg) { var el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1900); }

  /* ================= Eventos ================= */
  document.addEventListener("click", function (e) {
    var tipEl = e.target.closest && e.target.closest("[data-tip]");
    if (tipEl) {
      var tk = tipEl.getAttribute("data-k");
      if (tk !== ui.month) { ui.month = tk; render(); var nt = document.querySelector('#rep-chart [data-tip="' + tipEl.getAttribute("data-tip").replace(/"/g, '\\"') + '"]'); if (nt) showTip(nt); }
      else showTip(tipEl);
      return;
    }
    var b = e.target.closest("[data-action]");
    if (!b) return;
    var a = b.getAttribute("data-action"), id = b.getAttribute("data-id");
    if (a === "tab") { closeSheet(); ui.tab = b.getAttribute("data-tab"); render(); window.scrollTo(0, 0); return; }
    if (a === "prev-month") { ui.month = addMonths(ui.month, -1); render(); return; }
    if (a === "next-month") { if (ui.month >= NOW_KEY) return; ui.month = addMonths(ui.month, 1); render(); return; }
    if (a === "fab") { openSheet({ inicio: "menu", pagos: "pago", gastos: "gasto", metas: "meta", reportes: "menu" }[ui.tab] || "menu"); return; }
    if (a === "close-sheet") { closeSheet(); return; }
    if (a === "sheet-save") { saveSheet(); return; }
    if (a === "sheet-del") { deleteSheet(); return; }
    if (a === "new-gasto") { openSheet("gasto", { tipo: b.getAttribute("data-tipo") }); return; }
    if (a === "edit-gasto") { openSheet("gasto", { id: id, k: b.getAttribute("data-k") }); return; }
    if (a === "new-pago") { openSheet("pago"); return; }
    if (a === "edit-pago") { openSheet("pago", { id: id }); return; }
    if (a === "new-meta") { openSheet("meta"); return; }
    if (a === "edit-meta") { openSheet("meta", { id: id }); return; }
    if (a === "apartar") { openSheet("apartado", { meta: id }); return; }
    if (a === "edit-apartado") { openSheet("apartado", { id: id, meta: b.getAttribute("data-meta") }); return; }
    if (a === "new-cat") { openSheet("cat"); return; }
    if (a === "edit-cat") { openSheet("cat", { id: id }); return; }
    if (a === "new-tipo") { openSheet("tipo"); return; }
    if (a === "edit-tipo") { openSheet("tipo", { id: id }); return; }
    if (a === "new-extra") { openSheet("extra"); return; }
    if (a === "edit-extra") { openSheet("extra", { id: id }); return; }
    if (a === "new-deuda") { openSheet("deuda"); return; }
    if (a === "edit-deuda") { openSheet("deuda", { id: id }); return; }
    if (a === "tipo-from-gasto") {
      var s = ui.sheet;
      ui.returnTo = { id: s.id, k: s.k, carry: { monto: num(val("s-monto")), nota: val("s-nota"), lugar: val("s-lugar"), metodo: val("s-metodo"), fecha: val("s-fecha"), cat: val("s-cat") } };
      openSheet("tipo"); return;
    }
    if (a === "pick") {
      var grp = b.getAttribute("data-group"), v = b.getAttribute("data-v");
      ui.sheet.draft[grp] = v;
      b.parentNode.querySelectorAll("button[data-group]").forEach(function (x) { var on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
      if (grp === "tipo") { var tp = tipo(v), sc = document.getElementById("s-cat"); if (tp && sc) sc.value = tp.cat; }
      return;
    }
    if (a === "add-part") { document.getElementById("s-parts").insertAdjacentHTML("beforeend", partRow()); var rows = document.querySelectorAll("#s-parts .p-nombre"); rows[rows.length - 1].focus(); return; }
    if (a === "del-part") { b.closest(".part").remove(); return; }
    if (a === "toggle-pago") {
      var k = b.getAttribute("data-k"), md = monthData(k), key = b.getAttribute("data-key");
      if (md.pagados[key]) delete md.pagados[key]; else md.pagados[key] = true;
      persist("m-" + k); render(); return;
    }
    if (a === "toggle-item") {
      var mt = byId(plan.metas, b.getAttribute("data-meta")), it = mt && byId(mt.items, id);
      if (it) { it.pagado = !it.pagado; persist("plan"); render(); }
      return;
    }
    if (a === "meta-up" || a === "meta-down") {
      var i = plan.metas.findIndex(function (x) { return x.id === id; }), j = a === "meta-up" ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= plan.metas.length) return;
      var tmp = plan.metas[i]; plan.metas[i] = plan.metas[j]; plan.metas[j] = tmp;
      persist("plan"); render(); return;
    }
    if (a === "respaldo") { descargarRespaldo(); return; }
    if (a === "restaurar") { openSheet("restaurar"); return; }
    if (a === "restaurar-texto") { restaurarDesdeTexto(document.getElementById("r-text").value); return; }
    if (a === "rep-modo") { ui.repModo = b.getAttribute("data-v"); render(); return; }
    if (a === "rep-mes") { ui.month = b.getAttribute("data-k"); render(); return; }
    if (a === "rep-det") { openSheet("detalle", { id: id }); return; }
    if (a === "filtro") { ui.filtro = b.getAttribute("data-v"); render(); return; }
    if (a === "estrategia") { plan.estrategia = b.getAttribute("data-v"); persist("plan"); render(); return; }
    if (a === "reset-sim") { plan.sim = { recorte: 0, extra: 0 }; persist("plan"); render(); return; }
  });

  function showTip(el) {
    var ch = document.getElementById("rep-chart"); if (!ch) return;
    var tip = ch.querySelector(".tip"), svg = ch.querySelector("svg"), sc = svg.getBoundingClientRect().width / 340;
    var p = el.getAttribute("data-tip").split("|");
    tip.innerHTML = esc(p[0]) + " · " + esc(p[1]) + "<b>" + esc(p[2]) + "</b>";
    tip.style.left = (+el.getAttribute("data-x") * sc) + "px"; tip.style.top = (+el.getAttribute("data-y") * sc) + "px";
    tip.hidden = false;
  }
  document.addEventListener("pointerover", function (e) { var el = e.target.closest && e.target.closest("[data-tip]"); if (el && e.pointerType === "mouse") showTip(el); });
  document.addEventListener("pointerout", function (e) { var el = e.target.closest && e.target.closest("[data-tip]"); if (el && e.pointerType === "mouse") { var t = document.querySelector("#rep-chart .tip"); if (t) t.hidden = true; } });

  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "r-file" && el.files && el.files[0]) { var fr = new FileReader(); fr.onload = function () { restaurarDesdeTexto(String(fr.result)); }; fr.readAsText(el.files[0]); return; }
    if (el.id === "s-frec") { updateFreq(); return; }
    if (el.hasAttribute("data-field")) { plan[el.getAttribute("data-field")] = num(el.value); persist("plan"); render(); return; }
    if (el.hasAttribute("data-sim")) { persist("plan"); render(); }
  });
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.hasAttribute("data-sim")) {
      plan.sim[el.getAttribute("data-sim")] = num(el.value);
      var t = totals();
      document.getElementById("sim-recorte-v").textContent = num(plan.sim.recorte) + "% (" + fmt(t.variables * num(plan.sim.recorte) / 100) + "/mes)";
      document.getElementById("sim-extra-v").textContent = fmt(plan.sim.extra);
      document.getElementById("metas-list").innerHTML = metaCards();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && ui.sheet) closeSheet();
    if (e.key === "Enter" && ui.sheet && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { e.preventDefault(); saveSheet(); }
  });

  /* ================= Arranque ================= */
  if ("serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
  lsLoad();
  migrateMonths();
  if (migrated || Object.keys(dirtyMonths).length) lsSave();
  render();
  connect();
})();
</script>
</body>
</html>
